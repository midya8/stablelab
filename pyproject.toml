[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "stablelab"
version = "0.3.0"
description = "Finite normal logic-program reduct, support and stable-model evidence"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
stablelab = "stablelab.__main__:main"
[tool.setuptools]
packages = ["stablelab"]
